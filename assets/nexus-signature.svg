<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS signature</title>
  <desc id="desc">A compact Rushit NEXUS signature mark.</desc>
