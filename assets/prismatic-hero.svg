<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">PRISMATIC OS: Rushit engineering the unseen</title>
  <desc id="desc">A translucent prismatic computational object floating in a dark glass universe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090A09"/><stop offset=".56" stop-color="#171A19"/><stop offset="1" stop-color="#211D2F"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B4FF52" stop-opacity=".42"/><stop offset=".45" stop-color="#E7E6DF" stop-opacity=".1"/><stop offset="1" stop-color="#A792FF" stop-opacity=".45"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E7E6DF" stroke-opacity=".07"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/><rect width="1200" height="480" fill="url(#grid)"/>
  <circle cx="875" cy="245" r="190" fill="#A792FF" fill-opacity=".15" filter="url(#blur)"/>
  <g fill="none" stroke="#E7E6DF" stroke-opacity=".34">
    <ellipse cx="875" cy="245" rx="250" ry="72" transform="rotate(-23 875 245)" stroke-width="2"/>
    <ellipse cx="875" cy="245" rx="220" ry="65" transform="rotate(47 875 245)" stroke-width="1"/>
    <ellipse cx="875" cy="245" rx="160" ry="48" transform="rotate(90 875 245)" stroke="#B4FF52" stroke-width="2"/>
  </g>
  <g transform="translate(875 245)">
    <path d="M0-125L118-43 77 100-48 122-116 8-75-92Z" fill="url(#glass)" stroke="#E7E6DF" stroke-opacity=".66" stroke-width="2"/>
    <path d="M0-125V10L77 100M0 10L-116 8M0 10L-48 122M0 10L118-43" fill="none" stroke="#E7E6DF" stroke-opacity=".6"/>
    <path d="M0-64L58-24 38 44-24 61-61 9-40-43Z" fill="#B4FF52" fill-opacity=".18" stroke="#B4FF52" stroke-width="2"/>
    <circle r="11" fill="#B4FF52"/><circle r="4" fill="#090A09"/>
  </g>
  <g fill="#E7E6DF" font-family="monospace">
    <text x="58" y="68" font-size="12" letter-spacing="4" fill="#B4FF52">PRISMATIC OS / PERSONAL COMPUTATIONAL ENVIRONMENT</text>
    <text x="55" y="188" font-size="74" font-weight="700" letter-spacing="6">RUSHIT</text>
    <text x="58" y="234" font-size="25" letter-spacing="5">ENGINEERING THE UNSEEN.</text>
    <text x="60" y="292" font-size="12" fill="#B9BBB3">COMPUTER SCIENCE  /  SOFTWARE  /  INTELLIGENCE</text>
    <text x="60" y="345" font-size="11" fill="#B4FF52">[ MODE: LEARNING / BUILDING / CONTRIBUTING ]</text>
    <text x="60" y="420" font-size="10" fill="#B9BBB3">OBJECT 000 // IDEAS → IMPLEMENTATION</text>
  </g>
</svg>
